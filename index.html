<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantacalcio Manageriale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SCHERMATA DI ACCESSO -->
<section id="schermata-accesso" class="schermata">
  <div class="card-accesso">
    <div class="stemma">⚽</div>
    <h1>FANTACALCIO<br>MANAGERIALE</h1>
    <p class="sottotitolo">Entra nella tua squadra</p>
    <input id="input-nickname" type="text" placeholder="Nome squadra" autocomplete="off" />
    <input id="input-pin" type="password" placeholder="PIN a 4 cifre" maxlength="4" inputmode="numeric" />
    <button id="btn-entra" class="btn-primario">Entra</button>
    <p id="errore-accesso" class="errore" hidden></p>
  </div>
</section>

<!-- SCHERMATA SQUADRA -->
<section id="schermata-squadra" class="schermata" hidden>
  <header class="intestazione">
    <div>
      <p class="eyebrow">La mia squadra</p>
      <h2 id="nome-squadra-titolo">—</h2>
    </div>
    <div class="azioni-intestazione">
      <button id="btn-istruzioni" class="btn-secondario">📖 Istruzioni</button>
      <button id="btn-esci" class="btn-secondario">Esci</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn attivo" data-tab="anagrafica">Anagrafica</button>
    <button class="tab-btn" data-tab="stadio">Stadio</button>
    <button class="tab-btn" data-tab="sponsor">Sponsor &amp; Premi</button>
    <button class="tab-btn" data-tab="rosa">Rosa</button>
    <button class="tab-btn" data-tab="mercato">Mercato</button>
    <button class="tab-btn" data-tab="prestiti">Banca</button>
    <button class="tab-btn" data-tab="bilancio">Conto Economico</button>
  </nav>

  <main id="contenuto-tab"></main>
</section>

<!-- SCHERMATA LEGA -->
<section id="schermata-lega" class="schermata" hidden>
  <header class="intestazione">
    <div>
      <p class="eyebrow">Registro di lega</p>
      <h2>Tutte le squadre</h2>
    </div>
    <button id="btn-torna-squadra" class="btn-secondario">← Torna alla mia squadra</button>
  </header>
  <main id="contenuto-lega"></main>
</section>

<!-- SCHERMATA ADMIN -->
<section id="schermata-admin" class="schermata" hidden>
  <header class="intestazione">
    <div>
      <p class="eyebrow">Area ADMIN</p>
      <h2>Gestione squadre</h2>
    </div>
    <button id="btn-admin-esci" class="btn-secondario">Esci</button>
  </header>
  <main id="contenuto-admin"></main>
</section>

<!-- SCHERMATA ISTRUZIONI -->
<section id="schermata-istruzioni" class="schermata" hidden>
  <header class="intestazione">
    <div>
      <p class="eyebrow">Guida</p>
      <h2>Istruzioni</h2>
    </div>
    <button id="btn-istruzioni-torna" class="btn-secondario">← Torna alla mia squadra</button>
  </header>
  <main id="contenuto-istruzioni"></main>
</section>

<script>
  // Se il sito non parte per un errore nei file (es. firebase-config.js scritto male),
  // mostralo scritto in pagina invece di restare muto — così si vede subito cosa non va.
  window.addEventListener('error', function(e) {
    var el = document.getElementById('errore-accesso');
    if (el) {
      el.hidden = false;
      el.textContent = 'Errore nel caricamento del sito: ' + (e.message || e) + (e.filename ? (' (file: ' + e.filename + ', riga ' + e.lineno + ')') : '');
    }
  });
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
