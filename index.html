<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantacalcio Manageriale</title>
  <style>
    :root {
      --sfondo: #0f1419;
      --carta: #1a2332;
      --gesso: #e8eef7;
      --gesso-ombra: #8b9bb4;
      --ambra: #f5a623;
      --verde: #2ecc71;
      --rosso: #e74c3c;
      --bordo: #2a3548;
      --font-cifre: 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--sfondo);
      color: var(--gesso);
      min-height: 100vh;
      line-height: 1.45;
    }
    .schermata { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1, h2, h3, h4 { font-weight: 600; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    h2 { font-size: 1.25rem; }
    h3 { font-size: 1.05rem; margin-bottom: 12px; color: var(--ambra); }
    .sezione {
      background: var(--carta);
      border: 1px solid var(--bordo);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-size: 0.85rem; color: var(--gesso-ombra); margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--bordo);
      border-radius: 6px;
      background: #0d1219;
      color: var(--gesso);
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: 1px solid var(--ambra); }
    .griglia-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .griglia-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 700px) {
      .griglia-2, .griglia-3 { grid-template-columns: 1fr; }
    }
    .riga-check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .riga-check input { width: auto; }
    .riga-check-ok { color: var(--verde); font-size: 0.9rem; margin: 8px 0; }
    .riga-check-warn { color: var(--rosso); font-size: 0.9rem; margin: 8px 0; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .btn-principale {
      background: var(--ambra);
      color: #1a1200;
      width: 100%;
      margin-top: 12px;
    }
    .btn-principale:hover { filter: brightness(1.1); }
    .btn-piccolo {
      background: #2a3a52;
      color: var(--gesso);
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .btn-testo {
      background: transparent;
      color: var(--rosso);
      padding: 2px 6px;
      font-size: 1rem;
    }
    .btn-secondario {
      background: transparent;
      border: 1px solid var(--bordo);
      color: var(--gesso-ombra);
      margin-top: 8px;
      width: 100%;
    }
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 16px 0 12px;
    }
    .tab-btn {
      background: #1e2a3c;
      color: var(--gesso-ombra);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .tab-btn.attivo {
      background: var(--ambra);
      color: #1a1200;
    }
    .tabella-scroll { overflow-x: auto; margin: 10px 0; }
    table.tabella-rosa {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    table.tabella-rosa th {
      text-align: left;
      padding: 6px 8px;
      color: var(--gesso-ombra);
      border-bottom: 1px solid var(--bordo);
      white-space: nowrap;
    }
    table.tabella-rosa td {
      padding: 4px 6px;
      border-bottom: 1px solid #1e2a3c;
    }
    table.tabella-rosa input, table.tabella-rosa select {
      padding: 4px 6px;
      font-size: 0.85rem;
      min-width: 60px;
    }
    .cifra { font-family: var(--font-cifre); text-align: right; }
    .header-squadra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    .errore {
      color: var(--rosso);
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .card-squadra {
      background: var(--carta);
      border: 1px solid var(--bordo);
      border-radius: 10px;
      padding: 14px;
    }
    .card-squadra h4 { margin-bottom: 10px; color: var(--ambra); }
    .riga-dato {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin: 4px 0;
      color: var(--gesso-ombra);
    }
    .riga-dato b { color: var(--gesso); font-family: var(--font-cifre); }
    .griglia-lega {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .accesso-box {
      max-width: 380px;
      margin: 60px auto 0;
      background: var(--carta);
      border: 1px solid var(--bordo);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .accesso-box h1 { text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- SCHERMATA ACCESSO -->
  <div id="schermata-accesso" class="schermata">
    <div class="accesso-box">
      <h1>Fantacalcio Manageriale</h1>
      <div class="campo">
        <label>Nome squadra / Nickname</label>
        <input type="text" id="input-nickname" placeholder="Es. Intertisti" autocomplete="off" />
      </div>
      <div class="campo">
        <label>PIN (4 cifre)</label>
        <input type="password" id="input-pin" placeholder="••••" maxlength="4" inputmode="numeric" />
      </div>
      <p id="errore-accesso" class="errore" hidden></p>
      <button id="btn-entra" class="btn-principale">Entra / Crea squadra</button>
      <button id="btn-vedi-lega" class="btn-secondario">Vedi classifica lega</button>
    </div>
  </div>

  <!-- SCHERMATA SQUADRA -->
  <div id="schermata-squadra" class="schermata" hidden>
    <div class="header-squadra">
      <h1 id="nome-squadra-titolo">—</h1>
      <div style="display:flex; gap:8px;">
        <button id="btn-lega" class="btn-piccolo">Lega</button>
        <button id="btn-esci" class="btn-piccolo">Esci</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn attivo" data-tab="anagrafica">Anagrafica</button>
      <button class="tab-btn" data-tab="stadio">Stadio</button>
      <button class="tab-btn" data-tab="sponsor">Sponsor & Premi</button>
      <button class="tab-btn" data-tab="rosa">Rosa</button>
      <button class="tab-btn" data-tab="mercato">Mercato</button>
      <button class="tab-btn" data-tab="prestiti">Prestiti</button>
      <button class="tab-btn" data-tab="bilancio">Bilancio</button>
    </div>

    <div id="contenuto-tab"></div>
  </div>

  <!-- SCHERMATA LEGA -->
  <div id="schermata-lega" class="schermata" hidden>
    <div class="header-squadra">
      <h1>Lega</h1>
      <button id="btn-torna-squadra" class="btn-piccolo">← Torna</button>
    </div>
    <div id="contenuto-lega"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
